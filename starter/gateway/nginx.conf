events {}

http {
  # DNS de Docker : les noms de services sont résolus à chaque requête (valides 5 s),
  # pour suivre les conteneurs recréés ou redémarrés qui changent d'adresse IP.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;

    set $commandes http://commandes:3000;
    set $paiement  http://paiement:3000;
    set $dispatch  http://dispatch:3000;
    set $suivi     http://suivi:3000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    # Suivi en direct (SSE) : pas de mise en tampon, connexions longues.
    location ~ ^/orders/[^/]+/events$ {
      proxy_pass $suivi;
      proxy_buffering off;
      proxy_read_timeout 1h;
    }

    location /orders { proxy_pass $commandes; }

    location = /webhooks/psp                { proxy_pass $paiement; }
    location = /webhooks/restaurants        { proxy_pass $dispatch; }
    location = /webhooks/couriers           { proxy_pass $dispatch; }
    location = /webhooks/couriers/positions { proxy_pass $suivi; }

    location /admin/  { proxy_pass $commandes; }
    location = /audit { proxy_pass $commandes; }
    location /health/ { proxy_pass $commandes; }

    location / { return 404; }
  }
}
